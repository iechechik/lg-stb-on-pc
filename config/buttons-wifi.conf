# Карта кнопок для приложения «AirMouse — Smart TV Remote» (SAASWISE LTD).
# Google Play: https://play.google.com/store/apps/details?id=app.airmouse.android
# Кнопки приложения-пульта в режиме Wi-Fi.
#
# Формат: ИМЯ_КНОПКИ=ДЕЙСТВИЕ
# Слева — как кнопку называет приложение (имя из протокола LG),
# справа — что делает приставка (действия из /opt/stb/bin/stb-key-action-action).
#
# Действия: ok, up, down, left, right, back, home, menu, volup, voldown, mute,
#           chup, chdown, playkey, pausekey, play, prev, next,
#           red, green, yellow, blue, info, guide, cc, exit, tobox
#
# Возврат с телевизора на приставку — двойное нажатие Back (окно задаётся
# параметром DOUBLE_BACK в stb.conf), поэтому отдельной строки для него нет.

ENTER=ok
OK=ok
BACK=back
HOME=home
MENU=menu
UP=up
DOWN=down
LEFT=left
RIGHT=right
VOLUMEUP=volup
VOLUMEDOWN=voldown
MUTE=mute
CHANNELUP=chup
CHANNELDOWN=chdown
PLAY=playkey
PAUSE=pausekey
STOP=pausekey
REWIND=prev
FASTFORWARD=next
RED=del          # красная: стереть символ в поле ввода
GREEN=erase      # зелёная: очистить поле целиком
YELLOW=yellow
BLUE=blue
INFO=info
GUIDE=guide
CC=cc
SUBTITLE=cc
SUBTITLES=cc
EXIT=exit
