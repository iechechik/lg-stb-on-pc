# /etc/stb/config — единственное место, где правятся настройки приставки.
#
# Формат: VAR="значение" (файл читается shell-скриптами и python-службами).
# Имена переменных с префиксами:
#   TV_  — телевизор LG
#   WF_  — приставка в роли телевизора LG (Wi-Fi пульт)
#   BT_  — Bluetooth
#   STB_ — общее
#   LAN_IF / TV_IF — сетевые интерфейсы

# ---------------------------------------------------------------- общее
STB_USER="stbuser"
STB_HOME="/home/stbuser"
STB_WEB_PORT="8090"

# ---------------------------------------------------------------- сеть
# LAN_IF — домашняя сеть (через неё приставка видна телефону и серверам),
# TV_IF  — провод, в который включён телевизор.
LAN_IF="wlp2s0"
TV_IF="enp0s25"

# Адрес приставки и широковещательный адрес: пусто = вычислить из LAN_IF.
STB_IP=""
STB_BCAST=""

# ---------------------------------------------------------------- телевизор
TV_IP="192.168.1.199"
TV_MAC="a8:23:fe:5a:b4:37"          # проводной MAC телевизора (WoL и опознание)
TV_MAC_ALT="00:51:ed:2c:72:60"  # Wi-Fi MAC: его шлёт Home Assistant
TV_PORT="3000"                    # SSAP
TV_APP_ID="org.jellyfin.webos"
TV_LIVE_APP="com.webos.app.livetv"   # свой эфир телевизора
TV_MODEL="49UK6450PLC"               # как приставка представляется моделью ТВ
TV_RECEIVER_TYPE="dvb"
TV_INPUT_ID="HDMI_3"
# Переключать телевизор на вход приставки при любом включении
TV_INPUT_ON_WAKE="1"
# Частота обновления экрана приставки, Гц. 60 — то, что этот телевизор держит
# стабильно: 120 он объявляет, но линия на ней сбоит (провалы картинки).
DISPLAY_RATE="60"
# Плитка «Телевизор» открывает приложение, которое смотрели последним (не наш вход).
# 0 — не вспоминать, оставить источник как есть.
TV_RESTORE_LAST="1"
# Если запомненного ещё нет — открыть это приложение (пусто — источник не менять).
TV_FALLBACK_APP="com.webos.app.livetv"
# Файл памяти «что показывал телевизор».
STB_TV_LAST="/var/lib/stb/tv-last"
TV_WAKE_CMD="tv on"

# Желаемый выход звука: external_arc | tv_speaker | external_optical | ...
# Пусто — не трогать. При включении ТВ и перед запуском Jellyfin проверяется
# и, если сбился, переключается обратно.
TV_SPEAKER="external_arc"
# Возможные выходы звука (телевизор своего списка не отдаёт, поэтому держим тут).
TV_SPEAKERS="tv_speaker external_arc tv_external_speaker external_optical headphone lineout bt_soundbar"
# Как часто проверять выход звука (секунды)
TV_SPEAKER_CHECK="30"

# ---------------------------------------------------------------- Wi-Fi пульт
# Как приставка представляется приложению-пульту (SSDP/SSAP).
WF_NAME="home-tvbox1"
WF_PORT="3000"
WF_UUID="uuid:972ab327-94aa-4800-b403-338110f0457a"
# Отвечать на поиск в сети (1) или только принимать по адресу (0).
# 0 — умная-дом-система HA не будет видеть приставку как «телевизор».
WF_DISCOVER="1"

# ---------------------------------------------------------------- Bluetooth
# Имя видно телефону в списке устройств. Меняется в двух местах:
# тут и в /etc/machine-info (PRETTY_HOSTNAME) — BlueZ берёт имя оттуда.
BT_NAME="home-tvbox1-bt"
BT_MAC="64:63:06:28:41:00"        # телефон-пульт
BT_PAIR_WINDOW="180"              # секунд видимости при сопряжении

# ---------------------------------------------------------------- лёгкий режим
# Через сколько секунд непрерывно выключенного телевизора гасить приставку
# полностью (включение телевизора её разбудит). 0 = не гасить.
IDLE_POWEROFF_AFTER="0"
# Гасить экран в режиме приставки после N минут без нажатий (0 — не гасить)
SCREENSAVER_MINUTES="5"
APP_HIDE_MINUTES="10"   # сколько приложение живёт скрытым, потом закрывается
# Через сколько минут после открытия заставки гасить телевизор.
# Работает только в режиме приставки: в режиме телевизора заставки нет.
# 0 — не гасить. По умолчанию 10: итого 15 минут от последнего нажатия.
STB_TV_SLEEP_AFTER="10"

# 1 — только писать в журнал, не гасить (для проверок)
STB_POWEROFF_DRY="0"
# 1 — не смотреть на ssh-сессии (только для проверок)
STB_POWEROFF_IGNORE_SSH="0"

# Кнопки с выдержкой, через пробел. Для них двойное нажатие — отдельное событие
# (<кнопка>-double в диспетчере), а одиночное ждёт окно и только потом уходит.
# Остальные кнопки через слой не идут: отправляются сразу, без ожидания.
GESTURES="BACK"
# Окно второго нажатия, секунды. Одиночное нажатие ждёт столько же.
DOUBLE_BACK="0.5"

# Склейка дублей: приложение-пульт присылает одно нажатие дважды (секунды)
DUP_GAP="0.1"
# Два клика ближе этого считаются одним (на сетке), секунды
# Чутьё точпада: приложение присылает движение крупными шагами, без
# множителя указатель прыгал в угол экрана.
POINTER_SPEED="0.35"
CLICK_GAP="0.35"
# Сколько секунд активности в ssh-сессии защищают приставку от выключения
SSH_IDLE_LIMIT="900"
# Файл плиток; пусто — config/tiles.json
STB_TILES=""
# Склейка повторов одной кнопки (секунды): одно нажатие приходит парой событий.
# На отдельную кнопку переопределяется как DUP_<ИМЯ>, окно — DOUBLE_<ИМЯ>.
DUP_BACK="0.1"
# Писать в журнал сырые сообщения кнопок от приложения (1/0).
# Нужно только при разборе пульта: одно нажатие — одна строка.
STB_LOG_RAW="0"
# Через сколько секунд сведения о телевизоре считаются устаревшими.
STB_TV_STATE_MAX_AGE="90"
# сколько секунд терпеть «в сети, но SSAP молчит», прежде чем спросить питание самим
TV_UNKNOWN_LIMIT="180"
