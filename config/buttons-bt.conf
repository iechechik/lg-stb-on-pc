# Карта кнопок для приложения-пульта в режиме Bluetooth (AirMouse, режим BT).
# Google Play: (впиши ссылку на свою версию — пока не записана)
# Подробности про BT-режим: /opt/stb-setup/BT-PAULT.md
# Кнопки BT-пульта (эмуляция клавиатуры/мыши по Bluetooth).
#
# Формат: X-КЛАВИША=ДЕЙСТВИЕ
# Слева — имя клавиши, которую телефон присылает в X (см. `xbindkeys -k`),
# справа — действие из /opt/stb/bin/stb-key-action-action.
#
# Из этого файла собирается ~/.xbindkeysrc командой:
#     sudo stb keys apply bt
# Руками ~/.xbindkeysrc не править — перезапишется.

XF86PowerOff=power
XF86AudioRaiseVolume=volup
XF86AudioLowerVolume=voldown
XF86AudioMute=mute
XF86Back=back
XF86HomePage=home
XF86MenuKB=menu
XF86AudioPlay=play
XF86AudioRewind=prev
XF86AudioForward=next
XF86Search=down
