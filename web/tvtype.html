<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Текст на телевизор</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column;
         align-items: center; justify-content: center; gap: 26px;
         font-family: system-ui, "DejaVu Sans", sans-serif;
         background: radial-gradient(circle at 30% 15%, #1b2740, #090c12 70%); color: #eef4ff; }
  h1 { font-size: 40px; font-weight: 600; margin: 0; color: #9fb3d1; }
  textarea { width: min(1200px, 92vw); height: 30vh; font-size: 40px; padding: 18px 24px;
             border-radius: 16px; border: 2px solid rgba(255,255,255,.18);
             background: rgba(255,255,255,.08); color: #fff; outline: none; resize: none; }
  textarea:focus { border-color: #6f9dff; background: rgba(120,170,255,.14); }
  .row { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
  button { font-size: 32px; padding: 16px 32px; border-radius: 16px; cursor: pointer;
           border: 1px solid rgba(255,255,255,.2); background: rgba(120,170,255,.22); color: #eef4ff; }
  button:hover { background: rgba(120,170,255,.38); }
  #st { font-size: 26px; color: #9db2cf; min-height: 34px; }
  .hint { font-size: 20px; color: #7f94b0; text-align: center; max-width: 1100px; }
</style>
</head>
<body>
<h1>Текст на телевизор</h1>
<textarea id="t" placeholder="набери текст и нажми «Отправить»" autofocus></textarea>
<div class="row">
  <button id="send">Отправить</button>
  <button id="sendenter">Отправить + Enter</button>
  <button id="enter">Только Enter</button>
  <a href="/" style="font-size:26px;color:#9db2cf;align-self:center;text-decoration:none">← на приставку</a>
</div>
<div id="st"></div>
<div class="hint">Кириллица уходит в приложение телевизора через его внутренний сервис ввода —
так же, как это делает родной пульт LG. Раскладка приставки переключается кнопкой «сетка» (▦).</div>
<script>
  const t = document.getElementById('t'), st = document.getElementById('st');
  function go(enter) {
    const text = t.value;
    if (!text && !enter) { st.textContent = 'пусто'; return; }
    st.textContent = 'отправляю…';
    const url = '/tv/text?t=' + encodeURIComponent(text) + (enter ? '&enter=1' : '');
    fetch(url).then(r => r.json()).then(j => {
      st.textContent = j.ok ? (j.msg || 'готово') : ('ошибка: ' + j.msg);
    }).catch(e => st.textContent = 'ошибка: ' + e);
  }
  document.getElementById('send').onclick = () => go(false);
  document.getElementById('sendenter').onclick = () => go(true);
  document.getElementById('enter').onclick = () => { t.value = ''; go(true); };
  t.addEventListener('keydown', e => { if (e.key === 'Enter' && e.ctrlKey) go(true); });
</script>
</body>
</html>
